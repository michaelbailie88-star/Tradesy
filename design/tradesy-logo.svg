<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="tool-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Shield -->
  <path d="M28 12 L52 12 L52 38 Q52 52 40 58 Q28 52 28 38 Z" fill="url(#shield-grad)"/>

  <!-- Shield border highlight -->
  <path d="M30 14 L50 14 L50 38 Q50 50 40 55.6 Q30 50 30 38 Z" fill="none" stroke="#BFDBFE" stroke-width="0.5" opacity="0.5"/>

  <!-- Wrench in shield -->
  <g transform="translate(32, 24) scale(0.55)">
    <circle cx="14" cy="14" r="8" fill="none" stroke="white" stroke-width="3.5"/>
    <rect x="11" y="20" width="6" height="22" rx="3" fill="white"/>
    <rect x="5" y="40" width="18" height="5" rx="2.5" fill="white"/>
  </g>

  <!-- Screwdriver in shield -->
  <g transform="translate(46, 26) scale(0.45)">
    <rect x="6" y="0" width="3" height="28" rx="1.5" fill="white"/>
    <rect x="0" y="26" width="15" height="6" rx="2" fill="url(#tool-grad)"/>
  </g>

  <!-- Wordmark "Tradesy" -->
  <text x="70" y="48" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="36" fill="#111827" letter-spacing="-0.5">Tradesy</text>

  <!-- Tagline -->
  <text x="72" y="64" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="11" fill="#6B7280" letter-spacing="2">YOUR HOME, OUR PROS</text>
</svg>
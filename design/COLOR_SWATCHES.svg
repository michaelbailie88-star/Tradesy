<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <style>
    text { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
    .token { fill: #6B7280; font-size: 11px; }
    .hex { fill: #374151; font-size: 12px; font-weight: 600; }
    .label { fill: #111827; font-size: 16px; font-weight: 700; }
    .section { fill: #111827; font-size: 18px; font-weight: 700; }
  </style>

  <!-- Primary Blues -->
  <text x="24" y="30" class="section">Primary — Trustworthy Blue</text>

  <rect x="24" y="44" width="70" height="50" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="30" y="110" class="token">primary-50</text>
  <text x="30" y="124" class="hex">#EFF6FF</text>

  <rect x="110" y="44" width="70" height="50" rx="6" fill="#DBEAFE" stroke="#BFDBFE" stroke-width="1"/>
  <text x="116" y="110" class="token">primary-100</text>
  <text x="116" y="124" class="hex">#DBEAFE</text>

  <rect x="196" y="44" width="70" height="50" rx="6" fill="#BFDBFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="202" y="110" class="token">primary-200</text>
  <text x="202" y="124" class="hex">#BFDBFE</text>

  <rect x="282" y="44" width="70" height="50" rx="6" fill="#3B82F6"/>
  <text x="288" y="110" class="token" fill="#6B7280">primary-500</text>
  <text x="288" y="124" class="hex">#3B82F6</text>

  <rect x="368" y="44" width="70" height="50" rx="6" fill="#2563EB"/>

  <rect x="454" y="44" width="70" height="50" rx="6" fill="#1D4ED8"/>
  <text x="460" y="110" class="token" fill="#6B7280">primary-700</text>
  <text x="460" y="124" class="hex">#1D4ED8</text>

  <rect x="540" y="44" width="70" height="50" rx="6" fill="#1E40AF"/>
  <text x="546" y="110" class="token" fill="#6B7280">primary-800</text>
  <text x="546" y="124" class="hex">#1E40AF</text>

  <!-- Accent Ambers -->
  <text x="24" y="168" class="section">Accent — Warm Amber (CTAs, Ratings)</text>

  <rect x="24" y="182" width="70" height="50" rx="6" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
  <text x="30" y="248" class="token">accent-50</text>
  <text x="30" y="262" class="hex">#FFFBEB</text>

  <rect x="110" y="182" width="70" height="50" rx="6" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
  <text x="116" y="248" class="token">accent-100</text>
  <text x="116" y="262" class="hex">#FEF3C7</text>

  <rect x="196" y="182" width="70" height="50" rx="6" fill="#FBBF24"/>
  <text x="202" y="248" class="token" fill="#6B7280">accent-400</text>
  <text x="202" y="262" class="hex">#FBBF24</text>

  <rect x="282" y="182" width="70" height="50" rx="6" fill="#F59E0B"/>
  <text x="288" y="248" class="token" fill="#6B7280">accent-500</text>
  <text x="288" y="262" class="hex">#F59E0B</text>

  <rect x="368" y="182" width="70" height="50" rx="6" fill="#D97706"/>

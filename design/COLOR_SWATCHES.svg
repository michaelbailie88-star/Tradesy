  <rect x="24" y="322" width="90" height="50" rx="6" fill="#059669"/>
  <text x="30" y="388" class="hex" fill="#059669">#059669</text>
  <text x="30" y="402" class="token">Success</text>

  <rect x="130" y="322" width="90" height="50" rx="6" fill="#D97706"/>
  <text x="136" y="388" class="hex" fill="#D97706">#D97706</text>
  <text x="136" y="402" class="token">Warning</text>

  <rect x="236" y="322" width="90" height="50" rx="6" fill="#DC2626"/>

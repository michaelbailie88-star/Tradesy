  <text x="24" y="448" class="section">Neutrals</text>

  <rect x="24" y="462" width="60" height="50" rx="6" fill="#111827"/>
  <text x="30" y="528" class="hex" fill="#111827">#111827</text>
  <text x="30" y="542" class="token">gray-900</text>

  <rect x="100" y="462" width="60" height="50" rx="6" fill="#374151"/>
  <text x="106" y="528" class="hex" fill="#374151">#374151</text>
  <text x="106" y="542" class="token">gray-700</text>

  <rect x="176" y="462" width="60" height="50" rx="6" fill="#6B7280"/>
  <text x="182" y="528" class="hex" fill="#6B7280">#6B7280</text>
  <text x="182" y="542" class="token">gray-500</text>

  <rect x="252" y="462" width="60" height="50" rx="6" fill="#D1D5DB"/>
  <text x="258" y="528" class="hex" fill="#6B7280">#D1D5DB</text>
  <text x="258" y="542" class="token">gray-300</text>

  <rect x="328" y="462" width="60" height="50" rx="6" fill="#E5E7EB"/>
  <text x="334" y="528" class="hex" fill="#6B7280">#E5E7EB</text>
  <text x="334" y="542" class="token">gray-200</text>

  <rect x="404" y="462" width="60" height="50" rx="6" fill="#F3F4F6"/>
  <text x="410" y="528" class="hex" fill="#6B7280">#F3F4F6</text>
  <text x="410" y="542" class="token">gray-100</text>

  <rect x="480" y="462" width="60" height="50" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="486" y="528" class="hex" fill="#6B7280">#F9FAFB</text>
